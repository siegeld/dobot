<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Dobot CR5</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/dashboard.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 360px; background: var(--db-card); border: 1px solid var(--db-border); border-radius: 12px; padding: 1.5rem; }
    .brand { font-size: 1.15rem; font-weight: 600; }
    .tagline { font-size: 11px; font-style: italic; color: var(--db-muted); }
    .hint { font-size: 12px; color: var(--db-muted); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="login-card" id="card">
    <div class="d-flex align-items-center gap-2 mb-3">
      <i class="bi bi-robot fs-4" style="color: var(--db-accent)"></i>
      <div><div class="brand">Dobot CR5</div><div class="tagline">the arm on the bench, under control.</div></div>
    </div>

    <div id="sso-wait" role="status" class="text-center hint py-3">Signing you in…</div>

    <form id="form" class="hidden" autocomplete="on">
      <div class="mb-2"><input class="form-control form-control-sm" id="account" placeholder="username or email" autocomplete="username" required></div>
      <div class="mb-2"><input class="form-control form-control-sm" id="password" type="password" placeholder="password" autocomplete="current-password" required></div>
      <div class="form-check mb-2"><input class="form-check-input" type="checkbox" id="remember" checked><label class="form-check-label hint" for="remember">stay signed in</label></div>
      <div id="error" class="text-danger small mb-2 hidden" role="alert"></div>
      <button class="btn btn-primary btn-sm w-100" type="submit" id="submit">sign in</button>
      <div class="text-center hint mt-3">
        <span id="sso-unavailable" class="hidden">No domain sign-in from this browser — use your password. <a href="#" id="retry">try again</a></span>
        <a href="#" id="sso-link" class="hidden"><i class="bi bi-key"></i> Sign in with your domain account</a>
      </div>
      <div class="text-center hint mt-2" style="font-size: 11px">Active Directory · admins only</div>
    </form>
  </div>

  <script>
  (function () {
    // Same contract as every console on the estate (homelab-system-ui §7): try the
    // Kerberos ticket first with a RAW fetch (a 401 is the protocol, not an error),
    // show the form only when that comes back empty. An explicit sign-out sets a
    // session-scoped skip so the page does not sign the same person straight back in.
    var SKIP = 'dobot_sso_skip';
    var $ = function (id) { return document.getElementById(id); };
    function show(el, on) { el.classList.toggle('hidden', !on); }
    function skipped() { try { return sessionStorage.getItem(SKIP) === '1'; } catch (e) { return false; } }
    function setSkip(on) { try { on ? sessionStorage.setItem(SKIP, '1') : sessionStorage.removeItem(SKIP); } catch (e) {} }
    function done() { location.reload(); }

    function showForm(ssoFailed) {
      show($('sso-wait'), false); show($('form'), true);
      show($('sso-unavailable'), ssoFailed); show($('sso-link'), !ssoFailed);
      $('account').focus();
    }
    function trySso() {
      show($('form'), false); show($('sso-wait'), true);
      var ctl = new AbortController(); var t = setTimeout(function () { ctl.abort(); }, 10000);
      fetch('/auth/sso', { credentials: 'same-origin', headers: { Accept: 'application/json' }, signal: ctl.signal })
        .then(function (r) { clearTimeout(t); if (r.ok) { setSkip(false); done(); } else { showForm(true); } })
        .catch(function () { clearTimeout(t); showForm(true); });
    }
    $('retry').addEventListener('click', function (e) { e.preventDefault(); trySso(); });
    $('sso-link').addEventListener('click', function (e) { e.preventDefault(); trySso(); });
    $('form').addEventListener('submit', function (e) {
      e.preventDefault(); $('submit').disabled = true; show($('error'), false);
      fetch('/auth/login', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ account: $('account').value, password: $('password').value, remember: $('remember').checked }) })
        .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
        .then(function (x) { if (x.ok) { setSkip(false); done(); } else { $('error').textContent = x.b.detail || 'sign in failed'; show($('error'), true); } })
        .catch(function () { $('error').textContent = 'sign in failed'; show($('error'), true); })
        .then(function () { $('submit').disabled = false; });
    });
    if (skipped()) showForm(false); else trySso();
  })();
  </script>
</body>
</html>
