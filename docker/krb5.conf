# Kerberos client config for the backend container (browser SSO, RB — see
# doorman's docs/SSO.md on harbr2). Deliberately NOT the host's /etc/krb5.conf: that one uses a
# KEYRING ccache, which does not exist inside a container.
#
# The acceptor side (verifying a browser's HTTP/<host> ticket) needs only the
# keytab. The initiator side (the LDAP group lookup as the service account)
# needs a KDC, pinned here to the same DC the LDAP settings use, with DNS SRV
# as the fallback.
[libdefaults]
    default_realm = SIEGEL.COM
    dns_lookup_kdc = true
    dns_lookup_realm = false
    rdns = false
    dns_canonicalize_hostname = fallback
    default_ccache_name = MEMORY:dobot
    ticket_lifetime = 24h
    renew_lifetime = 7d

[realms]
    SIEGEL.COM = {
        kdc = dcrbr1.siegel.com:88
    }

[domain_realm]
    .siegel.com = SIEGEL.COM
    siegel.com = SIEGEL.COM
